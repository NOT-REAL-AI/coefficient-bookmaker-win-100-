<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Вилочный калькулятор | до 5 исходов</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', monospace;
        }

        body {
            background: #0c1a18;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app {
            max-width: 700px;
            width: 100%;
            background: #101f1c;
            border-radius: 32px;
            padding: 20px 18px 26px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #2c5a50;
        }

        h2 {
            margin: 0 0 6px 0;
            font-weight: 600;
            font-size: 1.6rem;
            color: #fad974;
            text-align: center;
        }

        .desc {
            text-align: center;
            color: #87b9ae;
            font-size: 0.75rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a4d44;
            padding-bottom: 10px;
        }

        /* список исходов */
        .outcomes {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .outcome-row {
            background: #08221e;
            border-radius: 60px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 18px;
            border: 1px solid #2b6a5c;
        }

        .coeff-input {
            width: 100px;
            background: #010f0d;
            border: 1px solid #479c88;
            border-radius: 40px;
            padding: 12px 8px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            color: #ffeca2;
            outline: none;
        }

        .coeff-input:focus {
            border-color: #ffcd7a;
        }

        .stake-input {
            width: 120px;
            background: #031613;
            border: 1px solid #3f8877;
            border-radius: 40px;
            padding: 12px 8px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            color: #e9dbbd;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: bold;
            background: #1b423b;
            padding: 4px 10px;
            border-radius: 30px;
            color: #cbe6de;
        }

        .remove-btn {
            background: #2d3024;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            width: 36px;
            height: 36px;
            border-radius: 40px;
            color: #f5bc70;
            cursor: pointer;
            margin-left: auto;
        }

        .remove-btn:hover {
            background: #5a3e2a;
            color: white;
        }

        .buttons-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 18px 0 16px;
        }

        .btn {
            background: #1d3c36;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: 500;
            color: #e1efc7;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-add {
            background: #2f6b5e;
            color: white;
        }

        .btn-reset {
            background: #2c2a1f;
        }

        .result {
            background: #041c18;
            border-radius: 28px;
            padding: 12px 16px;
            text-align: center;
            margin-top: 12px;
        }

        .profit {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffde9c;
        }

        .info {
            font-size: 0.7rem;
            color: #79aca0;
            margin-top: 10px;
        }

        .warning {
            background: #262216;
            border-radius: 30px;
            padding: 8px 12px;
            font-size: 0.7rem;
            color: #ebc17e;
            text-align: center;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 0.5;
        }
    </style>
</head>
<body>
<div class="app">
    <h2>⚡ ВИЛКА до 5 исходов</h2>
    <div class="desc">Введи коэффициенты (1.9 или 1,9 — работает) → меняй любую сумму → остальные подстроятся</div>

    <div id="outcomesList" class="outcomes"></div>

    <div class="buttons-bar">
        <button class="btn btn-add" id="addOutcomeBtn">➕ Добавить исход</button>
        <button class="btn btn-reset" id="resetDefaultBtn">⟳ 2 исхода (2.0 / 2.5)</button>
    </div>

    <div class="result">
        <div style="font-size:0.75rem; letter-spacing: 1px;">ЧИСТАЯ ПРИБЫЛЬ (при любом исходе)</div>
        <div class="profit" id="profitDisplay">0 ₽</div>
        <div class="info" id="payoutInfo">общая выплата: —</div>
    </div>
    <div class="warning" id="warningMsg">
        ✏️ Напиши коэф. (запятая → точка). При равных коэф. прибыль 0.
    </div>
</div>

<script>
    // Храним данные: для каждого исхода { coeff: number, stake: number, dom элементы }
    let outcomes = [];
    let nextId = 0;

    const outcomesContainer = document.getElementById('outcomesList');
    const profitDisplay = document.getElementById('profitDisplay');
    const payoutInfo = document.getElementById('payoutInfo');
    const warningMsgDiv = document.getElementById('warningMsg');

    // --- вспомогательные функции ---
    function normalizeCoeff(value) {
        if (value === undefined || value === null) return 1.01;
        // заменяем запятую на точку
        let str = String(value).trim().replace(',', '.');
        let num = parseFloat(str);
        if (isNaN(num)) return 1.01;
        if (num < 1.01) return 1.01;
        return num;
    }

    // пересчет ВСЕХ ставок, исходя из "исходного" (того, который пользователь менял)
    // lastChangedIndex - индекс исхода, сумму которого только что изменили вручную.
    // Пересчитываем остальные ставки так, чтобы выполнялось: ставка[i] * коэф[i] = ОДИНАКОВАЯ ВЫПЛАТА (TargetPayout)
    function recalcFromStake(changedIndex) {
        if (outcomes.length === 0) return;
        // проверка валидности коэффициентов
        let anyInvalid = false;
        for (let i = 0; i < outcomes.length; i++) {
            let coeff = outcomes[i].coeff;
            if (coeff < 1.01) {
                warningMsgDiv.innerText = `❌ Коэффициент ${i+1} должен быть >1 (сейчас ${coeff})`;
                anyInvalid = true;
                return;
            }
        }

        const changedStakeRaw = outcomes[changedIndex].stake;
        const changedCoeff = outcomes[changedIndex].coeff;

        if (isNaN(changedStakeRaw) || changedStakeRaw <= 0) {
            // если ввели отрицательное или ноль, то пересчет не делаем (можно поставить ноль, но вилка сломается)
            if (changedStakeRaw <= 0) {
                warningMsgDiv.innerText = `💰 Сумма должна быть больше 0, чтобы построить вилку.`;
                return;
            }
        }

        const targetPayout = changedStakeRaw * changedCoeff;   // одинаковая выплата
        // пересчитываем все остальные ставки
        let newStakes = [];
        let allValid = true;
        for (let i = 0; i < outcomes.length; i++) {
            if (i === changedIndex) {
                newStakes[i] = changedStakeRaw;
                continue;
            }
            let coeff = outcomes[i].coeff;
            let neededStake = targetPayout / coeff;
            if (neededStake < 0 || coeff <= 0) {
                allValid = false;
                break;
            }
            newStakes[i] = neededStake;
        }

        if (!allValid) {
            warningMsgDiv.innerText = "⚠️ Ошибка: некорректные коэффициенты";
            return;
        }

        // обновляем значения в массиве и инпуты
        for (let i = 0; i < outcomes.length; i++) {
            if (i === changedIndex) continue;
            outcomes[i].stake = newStakes[i];
            if (outcomes[i].stakeInput) {
                outcomes[i].stakeInput.value = newStakes[i].toFixed(2);
            }
        }

        // считаем общую сумму ставок и чистую прибыль
        let totalStaked = 0;
        for (let i = 0; i < outcomes.length; i++) {
            totalStaked += outcomes[i].stake;
        }
        let targetPay = outcomes[changedIndex].stake * outcomes[changedIndex].coeff;
        let netProfit = targetPay - totalStaked;

        if (netProfit < 0 && netProfit > -0.05) netProfit = 0;
        if (netProfit < 0) {
            profitDisplay.innerHTML = `⚠️ ${netProfit.toFixed(2)} ₽ (убыток)`;
            profitDisplay.style.color = "#f7ac8c";
            warningMsgDiv.innerHTML = `❗ При таких коэффициентах вилка не дает прибыли (убыток). Проверь коэфф.`;
        } else {
            profitDisplay.innerHTML = `${netProfit.toFixed(2)} ₽`;
            profitDisplay.style.color = "#ffde9c";
            if (Math.abs(netProfit) < 0.05 && outcomes.length >= 2) {
                warningMsgDiv.innerHTML = `🧾 Прибыль близка к 0 (коэффициенты почти равны или вилка отсутствует).`;
            } else {
                warningMsgDiv.innerHTML = `✅ Гарантированная выплата: ${targetPay.toFixed(2)} ₽. Общая сумма ставок: ${totalStaked.toFixed(2)} ₽. Чистый доход: ${netProfit.toFixed(2)} ₽.`;
            }
        }
        payoutInfo.innerText = `📊 При любом исходе выплата = ${targetPay.toFixed(2)} ₽ | Суммарно ставок: ${totalStaked.toFixed(2)} ₽`;
    }

    // принудительный пересчет на основе конкретного индекса, который НЕ менял сумму, просто синхронизация (например добавили исход)
    function syncAllFromIndex(baseIndex) {
        if (outcomes.length === 0) return;
        let baseIdx = baseIndex;
        if (baseIdx >= outcomes.length) baseIdx = 0;
        // убедимся что в базовой ставке есть адекватное число
        let baseStake = outcomes[baseIdx].stake;
        if (isNaN(baseStake) || baseStake <= 0) {
            // если базовая ставка не задана, ставим по умолчанию 100 на первый исход (или любой)
            if (outcomes[0].stake <= 0) {
                outcomes[0].stake = 100;
                if (outcomes[0].stakeInput) outcomes[0].stakeInput.value = "100";
                baseStake = 100;
                baseIdx = 0;
            } else {
                baseStake = outcomes[baseIdx].stake;
            }
        }
        // искусственно подменяем, чтобы вызвать пересчет
        let coeffBase = outcomes[baseIdx].coeff;
        let targetPayout = baseStake * coeffBase;
        let valid = true;
        let newStakes = [];
        for (let i = 0; i < outcomes.length; i++) {
            if (i === baseIdx) {
                newStakes[i] = baseStake;
                continue;
            }
            let needed = targetPayout / outcomes[i].coeff;
            if (needed < 0 || outcomes[i].coeff <= 0) {
                valid = false;
                break;
            }
            newStakes[i] = needed;
        }
        if (!valid) return;
        for (let i = 0; i < outcomes.length; i++) {
            outcomes[i].stake = newStakes[i];
            if (outcomes[i].stakeInput) {
                outcomes[i].stakeInput.value = newStakes[i].toFixed(2);
            }
        }
        let total = newStakes.reduce((s, v) => s + v, 0);
        let profit = targetPayout - total;
        if (profit < 0 && profit > -0.05) profit = 0;
        if (profit < 0) {
            profitDisplay.innerHTML = `⚠️ ${profit.toFixed(2)} ₽ (убыток)`;
            profitDisplay.style.color = "#f7ac8c";
            warningMsgDiv.innerHTML = `❗ Убыточная вилка, измени коэффициенты`;
        } else {
            profitDisplay.innerHTML = `${profit.toFixed(2)} ₽`;
            profitDisplay.style.color = "#ffde9c";
            warningMsgDiv.innerHTML = `✅ Готово: выплата ${targetPayout.toFixed(2)}₽, чистыми: ${profit.toFixed(2)}₽`;
        }
        payoutInfo.innerText = `🎯 Выплата любым исходом: ${targetPayout.toFixed(2)} ₽ | Общий объём ставок: ${total.toFixed(2)} ₽`;
    }

    // создание строки HTML с привязкой
    function renderOutcomes() {
        outcomesContainer.innerHTML = '';
        for (let i = 0; i < outcomes.length; i++) {
            const out = outcomes[i];
            const row = document.createElement('div');
            row.className = 'outcome-row';
            row.dataset.idx = i;

            // индекс на экране
            const idxSpan = document.createElement('span');
            idxSpan.className = 'badge';
            idxSpan.innerText = `Исход ${i+1}`;

            // поле коэффициента
            const coeffInput = document.createElement('input');
            coeffInput.type = 'text';  // text, чтобы ловить запятую
            coeffInput.inputMode = 'decimal';
            coeffInput.className = 'coeff-input';
            coeffInput.value = out.coeff.toFixed(2);
            
            // поле ставки
            const stakeInput = document.createElement('input');
            stakeInput.type = 'number';
            stakeInput.step = 'any';
            stakeInput.className = 'stake-input';
            stakeInput.value = out.stake.toFixed(2);
            
            const rubSpan = document.createElement('span');
            rubSpan.className = 'badge';
            rubSpan.innerText = '₽';

            const removeBtn = document.createElement('button');
            removeBtn.innerText = '✕';
            removeBtn.className = 'remove-btn';
            if (outcomes.length <= 2) {
                removeBtn.disabled = true;
                removeBtn.style.opacity = '0.4';
                removeBtn.style.cursor = 'not-allowed';
            } else {
                removeBtn.disabled = false;
            }

            row.appendChild(idxSpan);
            row.appendChild(coeffInput);
            row.appendChild(stakeInput);
            row.appendChild(rubSpan);
            row.appendChild(removeBtn);
            
            outcomesContainer.appendChild(row);
            
            // сохраняем ссылки
            out.coeffInput = coeffInput;
            out.stakeInput = stakeInput;
            out.removeBtn = removeBtn;

            // обработчики
            const updateCoeffFromInput = () => {
                let raw = coeffInput.value;
                let normalized = normalizeCoeff(raw);
                out.coeff = normalized;
                coeffInput.value = normalized.toFixed(2);
                // после изменения коэффициента, нужно пересчитать всё, опираясь на текущую ставку этого же исхода
                // но чтобы не сломать, пересчет от текущей ставки (индекс i)
                let currentStake = parseFloat(stakeInput.value);
                if (isNaN(currentStake) || currentStake <= 0) {
                    // если ставка невалид, зададим дефолт 100
                    currentStake = 100;
                    out.stake = 100;
                    stakeInput.value = "100";
                } else {
                    out.stake = currentStake;
                }
                recalcFromStake(i);
            };

            const updateStakeFromInput = () => {
                let rawStake = parseFloat(stakeInput.value);
                if (isNaN(rawStake) || rawStake < 0) rawStake = 0;
                if (rawStake === 0) {
                    warningMsgDiv.innerText = "Ставка не может быть нулевой для расчета вилки";
                    return;
                }
                out.stake = rawStake;
                recalcFromStake(i);
            };

            coeffInput.addEventListener('input', updateCoeffFromInput);
            stakeInput.addEventListener('input', updateStakeFromInput);
            
            if (removeBtn && !removeBtn.disabled) {
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (outcomes.length <= 2) return;
                    removeOutcome(i);
                });
            }
        }
    }

    function removeOutcome(idx) {
        if (outcomes.length <= 2) return;
        outcomes.splice(idx, 1);
        // переназначаем индексы, перерисовываем
        renderOutcomes();
        if (outcomes.length > 0) {
            // после удаления, пересчет от первого исхода с его ставкой
            let firstStake = outcomes[0].stake;
            if (firstStake <= 0) {
                outcomes[0].stake = 100;
                if (outcomes[0].stakeInput) outcomes[0].stakeInput.value = "100";
            }
            syncAllFromIndex(0);
        }
    }

    function addOutcome() {
        if (outcomes.length >= 5) {
            warningMsgDiv.innerText = "Максимум 5 исходов, убери лишний";
            return;
        }
        const newCoeff = 2.0;
        // берем за основу текущую выплату от первого исхода, чтобы новая ставка вписалась
        let targetPayout = 0;
        if (outcomes.length > 0 && outcomes[0].stake > 0 && outcomes[0].coeff > 0) {
            targetPayout = outcomes[0].stake * outcomes[0].coeff;
        } else {
            targetPayout = 200; // дефолт
        }
        let newStake = targetPayout / newCoeff;
        if (isNaN(newStake) || newStake <= 0) newStake = 100;
        
        outcomes.push({
            id: nextId++,
            coeff: newCoeff,
            stake: newStake,
        });
        renderOutcomes();
        // после добавления пересчитаем всё от первого исхода (индекс 0)
        if (outcomes.length >= 1) {
            let baseStake = outcomes[0].stake;
            if (baseStake <= 0) {
                outcomes[0].stake = 100;
                if (outcomes[0].stakeInput) outcomes[0].stakeInput.value = "100";
                baseStake = 100;
            }
            syncAllFromIndex(0);
        }
    }

    function resetToTwoOdds() {
        // сброс: 2 исхода с коэффициентами 2.0 и 2.5, ставка на первый = 1000
        outcomes = [];
        nextId = 0;
        outcomes.push({ id: nextId++, coeff: 2.0, stake: 1000 });
        outcomes.push({ id: nextId++, coeff: 2.5, stake: 0 });
        renderOutcomes();
        // после рендера, вычислим вторую ставку
        let k1 = outcomes[0].coeff, s1 = outcomes[0].stake;
        let needed2 = (s1 * k1) / outcomes[1].coeff;
        outcomes[1].stake = needed2;
        if (outcomes[1].stakeInput) outcomes[1].stakeInput.value = needed2.toFixed(2);
        syncAllFromIndex(0);
    }

    // инициализация по умолчанию: два исхода 2.0 и 2.5
    function initDefault() {
        outcomes = [];
        nextId = 0;
        outcomes.push({ id: nextId++, coeff: 2.0, stake: 1000 });
        outcomes.push({ id: nextId++, coeff: 2.5, stake: 0 });
        renderOutcomes();
        let s2 = (1000 * 2.0) / 2.5;
        outcomes[1].stake = s2;
        if (outcomes[1].stakeInput) outcomes[1].stakeInput.value = s2.toFixed(2);
        syncAllFromIndex(0);
    }

    document.getElementById('addOutcomeBtn').addEventListener('click', addOutcome);
    document.getElementById('resetDefaultBtn').addEventListener('click', resetToTwoOdds);
    
    initDefault();
</script>
</body>
</html>
